<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Household Budget</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Cropper.js CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
</head>

<body class="bg-gray-100 text-gray-900 antialiased min-h-screen pb-10">

  <!-- Main View -->
  <div id="accounts-view">
    <!-- Header -->
    <div class="bg-blue-600 text-white p-4 font-bold text-lg flex justify-between items-center shadow-md">
      <span>Household Budget</span>
      <div class="flex gap-2">
        <button onclick="openTxModal()"
          class="bg-blue-500 hover:bg-blue-400 text-white px-3 py-1 rounded-full text-sm font-semibold shadow border border-blue-400">
          + Add Tx
        </button>
        <button onclick="openAccountModal()"
          class="bg-white text-blue-600 px-3 py-1 rounded-full text-sm font-semibold shadow">
          + New Account
        </button>
      </div>
    </div>

    <!-- Content Container -->
    <div class="max-w-md mx-auto p-4 space-y-4">
      <div class="space-y-3">
        <h2 class="text-xl font-bold text-gray-800">Your Accounts</h2>
        <div id="accounts-list" class="space-y-3">
          <p class="text-sm text-gray-500">Loading accounts...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Transactions View -->
  <div id="transactions-view" class="hidden">
    <!-- Header -->
    <div class="bg-blue-600 text-white p-4 flex items-center justify-between shadow-md">
      <button onclick="showAccountsView()" class="text-white font-semibold text-sm flex items-center gap-1">
        &larr; Accounts
      </button>
      <span id="tx-header-title" class="font-bold text-lg">Account Details</span>
      <button onclick="openTxModal()"
        class="bg-white text-blue-600 px-3 py-1 rounded-full text-sm font-semibold shadow">
        + Add Tx
      </button>
    </div>

    <div class="max-w-md mx-auto p-4 space-y-4">
      <!-- Account Overview Card -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center">
        <div>
          <h2 id="tx-acc-name" class="text-lg font-bold text-gray-900"></h2>
          <p id="tx-acc-sub" class="text-xs text-gray-500 uppercase tracking-wider"></p>
        </div>
        <div class="text-right space-y-1">
          <div>
            <div id="tx-acc-balance" class="text-lg font-extrabold text-gray-900">$0.00</div>
            <div class="text-[10px] text-gray-500 font-semibold uppercase tracking-wider">Current Balance</div>
          </div>
          <div>
            <div id="tx-acc-cleared" class="text-sm font-bold text-emerald-600">$0.00</div>
            <div class="text-[10px] text-emerald-700 font-semibold uppercase tracking-wider">Cleared Balance</div>
          </div>
        </div>
      </div>

      <!-- Tag Filter Bar -->
      <div id="tag-filter-container"
        class="hidden flex flex-wrap items-center gap-1.5 bg-white p-3 rounded-xl border border-gray-100 shadow-sm">
        <span class="text-xs font-semibold text-gray-500 mr-1">Filter by Tag:</span>
        <div id="tag-filter-chips" class="flex flex-wrap gap-1"></div>
      </div>

      <!-- Transactions List -->
      <div class="space-y-3">
        <h3 class="text-md font-bold text-gray-800">Transaction History</h3>
        <div id="transactions-list" class="space-y-2">
          <p class="text-sm text-gray-500">Loading transactions...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Account Modal -->
  <div id="account-modal"
    class="fixed inset-0 bg-black/50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 space-y-4">
      <div class="flex justify-between items-center">
        <h3 id="modal-title" class="font-bold text-lg">Add New Account</h3>
        <button onclick="toggleAccountModal(false)" class="text-gray-400 text-2xl">&times;</button>
      </div>
      <form id="account-form" onsubmit="handleAccountSubmit(event)" class="space-y-3">
        <input type="hidden" id="editingAccId" value="" />
        <div>
          <label class="text-xs font-semibold text-gray-600">Account Name</label>
          <input type="text" id="accName" placeholder="e.g., Main Checking, Freedom Card" required
            class="w-full border p-2 rounded-lg mt-1" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-600">Account Type</label>
            <select id="accType" class="w-full border p-2 rounded-lg mt-1 bg-white">
              <option value="checking">Checking</option>
              <option value="savings">Savings</option>
              <option value="credit">Credit Card</option>
              <option value="cash">Cash</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-600">Initial Balance ($)</label>
            <input type="number" step="0.01" id="accBalance" placeholder="0.00" value="0.00"
              class="w-full border p-2 rounded-lg mt-1" />
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600">Institution / Bank</label>
          <input type="text" id="accInstitution" placeholder="e.g., Chase, Wells Fargo, Local CU"
            class="w-full border p-2 rounded-lg mt-1" />
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600">Account Number (or Last 4 Digits)</label>
          <input type="text" id="accNumber" placeholder="e.g., ****1234" class="w-full border p-2 rounded-lg mt-1" />
        </div>
        <div class="pt-2 space-y-2">
          <button type="submit" id="submitBtn"
            class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold shadow">
            Create Account
          </button>
          <button type="button" id="deleteBtn" onclick="handleDeleteFromModal()"
            class="w-full bg-red-50 text-red-600 border border-red-200 py-2 rounded-lg font-semibold shadow-sm hidden">
            Delete Account
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Add/Edit Transaction Modal -->
  <div id="tx-modal"
    class="fixed inset-0 bg-black/50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 id="tx-modal-title" class="font-bold text-lg">Add Transaction</h3>
        <button onclick="toggleTxModal(false)" class="text-gray-400 text-2xl">&times;</button>
      </div>
      <form id="tx-form" onsubmit="handleTxSubmit(event)" class="space-y-3">
        <input type="hidden" id="editingTxId" value="" />

        <!-- Account Selection (Required) -->
        <div>
          <label class="text-xs font-semibold text-gray-600">Account</label>
          <select id="txAccount" required class="w-full border p-2 rounded-lg mt-1 bg-white font-medium text-gray-800">
            <!-- Dynamically populated -->
          </select>
        </div>

        <!-- Description (Optional) -->
        <div>
          <label class="text-xs font-semibold text-gray-600">Description</label>
          <input type="text" id="txDesc" placeholder="e.g., Grocery Store, Paycheck"
            class="w-full border p-2 rounded-lg mt-1" />
        </div>

        <!-- Dynamic Payer / Payee Field (Optional) -->
        <div>
          <label id="txPayeeLabel" class="text-xs font-semibold text-gray-600">Payee</label>
          <input type="text" id="txPayee" placeholder="e.g., Walmart, Employer"
            class="w-full border p-2 rounded-lg mt-1" />
        </div>

        <!-- Type & Amount -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-600">Type</label>
            <select id="txType" onchange="updatePayeeLabel()" class="w-full border p-2 rounded-lg mt-1 bg-white">
              <option value="expense">Expense (-)</option>
              <option value="income">Income (+)</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-600">Amount ($)</label>
            <input type="number" step="0.01" id="txAmount" placeholder="0.00" required
              class="w-full border p-2 rounded-lg mt-1" />
          </div>
        </div>

        <!-- Payment Type Dropdown -->
        <div>
          <label class="text-xs font-semibold text-gray-600">Payment Type</label>
          <select id="txPaymentMethod" class="w-full border p-2 rounded-lg mt-1 bg-white">
            <option value="debit">Debit Card</option>
            <option value="credit">Credit Card</option>
            <option value="cash">Cash</option>
            <option value="check">Check</option>
            <option value="bank_transfer">Bank Transfer</option>
          </select>
        </div>

        <!-- Date & Status -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-xs font-semibold text-gray-600">Date</label>
            <input type="date" id="txDate" required class="w-full border p-2 rounded-lg mt-1" />
          </div>
          <div>
            <label class="text-xs font-semibold text-gray-600">Status</label>
            <select id="txStatus" class="w-full border p-2 rounded-lg mt-1 bg-white">
              <option value="pending">Pending</option>
              <option value="reconciled">Reconciled</option>
            </select>
          </div>
        </div>

        <!-- Tags -->
        <div>
          <label class="text-xs font-semibold text-gray-600">Tags (comma-separated)</label>
          <input type="text" id="txTags" placeholder="e.g., groceries, vacation, tax"
            class="w-full border p-2 rounded-lg mt-1" />
        </div>

        <!-- Receipt Attachments Section -->
        <div>
          <label class="text-xs font-semibold text-gray-600 block mb-1">Attach Receipts / Screenshots</label>
          
          <div class="grid grid-cols-2 gap-2 mt-1">
            <!-- Option A: Choose Existing Files -->
            <label class="flex items-center justify-center gap-1.5 bg-gray-100 hover:bg-gray-200 border border-gray-300 text-gray-700 text-xs font-semibold py-2 px-3 rounded-lg cursor-pointer text-center">
              <span>📁 Upload File</span>
              <input type="file" id="txReceiptFile" accept="image/*" class="hidden" onchange="handleImageInput(this)" />
            </label>

            <!-- Option B: Direct Camera Capture -->
            <label class="flex items-center justify-center gap-1.5 bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-700 text-xs font-semibold py-2 px-3 rounded-lg cursor-pointer text-center">
              <span>📷 Take Photo</span>
              <input type="file" id="txCameraFile" accept="image/*" capture="environment" class="hidden" onchange="handleImageInput(this)" />
            </label>
          </div>

          <!-- Selection Status Text -->
          <p id="fileSelectionStatus" class="text-[11px] text-gray-500 mt-1.5 font-medium hidden"></p>

          <!-- Container for Existing Individual Receipts -->
          <div id="receiptPreview" class="mt-3 hidden space-y-1.5">
            <span class="text-xs font-semibold text-gray-500 block">Existing Attachments:</span>
            <div id="receiptLinksList" class="space-y-1"></div>
          </div>
        </div>

        <!-- Submit Buttons -->
        <div class="pt-2 space-y-2">
          <button type="submit" id="txSubmitBtn"
            class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold shadow">
            Save Transaction
          </button>
          <button type="button" id="txDeleteBtn" onclick="handleDeleteTxFromModal()"
            class="w-full bg-red-50 text-red-600 border border-red-200 py-2 rounded-lg font-semibold shadow-sm hidden">
            Delete Transaction
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Image Cropper Modal -->
  <div id="cropModal" class="fixed inset-0 bg-black/75 hidden flex items-center justify-center p-4 z-50">
    <div class="bg-white w-full max-w-lg rounded-2xl p-4 space-y-3 flex flex-col">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-lg text-gray-800">Crop Image / Receipt</h3>
        <button type="button" onclick="cancelCrop()" class="text-gray-400 text-2xl">&times;</button>
      </div>
      <div class="max-h-[60vh] overflow-hidden flex justify-center bg-gray-100 rounded-lg">
        <img id="imageToCrop" src="" alt="Source" class="max-w-full block">
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="cancelCrop()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold text-sm">Cancel</button>
        <button type="button" onclick="confirmCrop()" class="px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold text-sm shadow">Crop & Add</button>
      </div>
    </div>
  </div>

  <!-- Cropper.js Script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

  <script>
    const SUPABASE_URL = "https://raujjskhrprnyigfmkwq.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhdWpqc2tocnBybnlpZ2Zta3dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3Njk0NzEsImV4cCI6MjEwMjM0NTQ3MX0.jEjU9BOmzpQpm-A4UlD8xrP2dpeQSiIEjj7-IuMbiVEe";
    
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      global: {
        headers: {
          apikey: SUPABASE_ANON_KEY,
          Authorization: `Bearer ${SUPABASE_ANON_KEY}`
        }
      }
    });

    let accounts = [];
    let transactions = [];
    let activeAccountId = null;
    let selectedTagFilter = null;
    let activeReceiptFiles = [];
    let activeReceiptUrls = [];

    let cropper = null;

    async function init() {
      await fetchAccounts();
      try {
        sb.channel('db-changes')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'accounts' }, () => fetchAccounts())
          .on('postgres_changes', { event: '*', schema: 'public', table: 'transactions' }, () => {
            if (activeAccountId) fetchTransactions(activeAccountId);
            fetchAccounts();
          })
          .subscribe();
      } catch (err) {
        console.warn("Realtime subscription warning:", err);
      }
    }

    async function fetchAccounts() {
      const list = document.getElementById('accounts-list');
      try {
        let { data, error } = await sb.from('accounts').select('*, transactions(amount, status)').order('created_at', { ascending: true });
        if (error) {
          const simple = await sb.from('accounts').select('*').order('created_at', { ascending: true });
          if (simple.error) throw simple.error;
          data = simple.data;
        }

        accounts = data || [];
        renderAccounts();
      } catch (err) {
        console.error("Error fetching accounts:", err);
        list.innerHTML = `
          <div class="bg-red-50 p-4 rounded-xl border border-red-200 text-center space-y-2">
            <p class="text-red-700 font-semibold text-sm">Error loading accounts</p>
            <p class="text-xs text-red-500">${err.message || 'Check database connection'}</p>
            <button onclick="fetchAccounts()" class="text-xs bg-red-600 text-white px-3 py-1 rounded-md font-semibold mt-1">Try Again</button>
          </div>
        `;
      }
    }

    function renderAccounts() {
      const list = document.getElementById('accounts-list');
      if (accounts.length === 0) {
        list.innerHTML = `
          <div class="bg-white p-6 rounded-xl border border-gray-200 text-center space-y-2">
            <p class="text-gray-600 font-medium">No accounts found.</p>
            <p class="text-xs text-gray-400">Tap "+ New Account" at the top to add your checking, savings, or credit card!</p>
          </div>
        `;
        return;
      }
      list.innerHTML = accounts.map(acc => {
        const initialBal = parseFloat(acc.initial_balance || 0);
        const txList = Array.isArray(acc.transactions) ? acc.transactions : [];

        const totalTxSum = txList.reduce((sum, tx) => sum + parseFloat(tx.amount || 0), 0);
        const currentBal = initialBal + totalTxSum;

        const clearedTxSum = txList.reduce((sum, tx) => {
          return tx.status === 'reconciled' ? sum + parseFloat(tx.amount || 0) : sum;
        }, 0);
        const clearedBal = initialBal + clearedTxSum;

        const instText = acc.institution ? acc.institution : '';
        const numText = acc.account_number ? `(${acc.account_number})` : '';
        const subDetails = [instText, numText].filter(Boolean).join(' ');

        return `
          <div onclick="showTransactionsView('${acc.id}')" class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center cursor-pointer hover:border-blue-300 transition-all">
            <div>
              <p class="font-semibold text-gray-900">${acc.name}</p>
              <p class="text-xs text-gray-500 uppercase tracking-wider">${acc.type} ${subDetails ? '• ' + subDetails : ''}</p>
              <div class="mt-2 text-xs">
                <button onclick="event.stopPropagation(); openAccountModal('${acc.id}')" class="text-blue-600 font-semibold hover:underline">Edit Account</button>
              </div>
            </div>
            <div class="text-right space-y-1">
              <div>
                <div class="text-base font-extrabold text-gray-900">$${currentBal.toFixed(2)}</div>
                <div class="text-[10px] text-gray-500 font-semibold uppercase tracking-wider">Current</div>
              </div>
              <div>
                <div class="text-xs font-bold text-emerald-600">$${clearedBal.toFixed(2)}</div>
                <div class="text-[10px] text-emerald-700 font-semibold uppercase tracking-wider">Cleared</div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    async function showTransactionsView(accId) {
      activeAccountId = accId;
      selectedTagFilter = null;
      const acc = accounts.find(a => a.id === accId);
      if (!acc) return;

      document.getElementById('accounts-view').classList.add('hidden');
      document.getElementById('transactions-view').classList.remove('hidden');

      const instText = acc.institution ? acc.institution : '';
      const numText = acc.account_number ? `(${acc.account_number})` : '';

      document.getElementById('tx-acc-name').textContent = acc.name;
      document.getElementById('tx-acc-sub').textContent = `${acc.type} ${[instText, numText].filter(Boolean).join(' • ')}`;

      await fetchTransactions(accId);
    }

    function showAccountsView() {
      activeAccountId = null;
      selectedTagFilter = null;
      document.getElementById('transactions-view').classList.add('hidden');
      document.getElementById('accounts-view').classList.remove('hidden');
    }

    async function fetchTransactions(accId) {
      if (!accId) return;
      const list = document.getElementById('transactions-list');
      try {
        const { data, error } = await sb.from('transactions').select('*').eq('account_id', accId).order('date', { ascending: false });
        if (error) throw error;

        transactions = data || [];

        const acc = accounts.find(a => a.id === accId);
        const initialBal = parseFloat(acc ? acc.initial_balance : 0);

        const totalTxSum = transactions.reduce((sum, tx) => sum + parseFloat(tx.amount || 0), 0);
        document.getElementById('tx-acc-balance').textContent = `$${(initialBal + totalTxSum).toFixed(2)}`;

        const clearedTxSum = transactions.reduce((sum, tx) => {
          return tx.status === 'reconciled' ? sum + parseFloat(tx.amount || 0) : sum;
        }, 0);
        document.getElementById('tx-acc-cleared').textContent = `$${(initialBal + clearedTxSum).toFixed(2)}`;

        renderTagFilters();
        renderTransactions();
      } catch (err) {
        console.error("Error fetching transactions:", err);
        list.innerHTML = `
          <div class="bg-red-50 p-4 rounded-xl border border-red-200 text-center space-y-2">
            <p class="text-red-700 font-semibold text-sm">Error loading transactions</p>
            <p class="text-xs text-red-500">${err.message || 'Check database connection'}</p>
          </div>
        `;
      }
    }

    function renderTagFilters() {
      const filterContainer = document.getElementById('tag-filter-container');
      const chipsContainer = document.getElementById('tag-filter-chips');

      const allTags = new Set();
      transactions.forEach(tx => {
        if (Array.isArray(tx.tags)) {
          tx.tags.forEach(t => allTags.add(t));
        }
      });

      if (allTags.size === 0) {
        filterContainer.classList.add('hidden');
        return;
      }

      filterContainer.classList.remove('hidden');

      let html = `<button onclick="setTagFilter(null)" class="px-2 py-0.5 text-xs font-medium rounded-full ${selectedTagFilter === null ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
        }">All</button>`;

      allTags.forEach(tag => {
        const isSelected = selectedTagFilter === tag;
        html += `<button onclick="setTagFilter('${tag}')" class="px-2 py-0.5 text-xs font-medium rounded-full ${isSelected ? 'bg-blue-600 text-white' : 'bg-blue-50 text-blue-700 hover:bg-blue-100'
          }">#${tag}</button>`;
      });

      chipsContainer.innerHTML = html;
    }

    function setTagFilter(tag) {
      selectedTagFilter = tag;
      renderTagFilters();
      renderTransactions();
    }

    function renderTransactions() {
      const list = document.getElementById('transactions-list');

      let filteredTx = transactions;
      if (selectedTagFilter) {
        filteredTx = transactions.filter(tx => Array.isArray(tx.tags) && tx.tags.includes(selectedTagFilter));
      }

      if (filteredTx.length === 0) {
        list.innerHTML = `
          <div class="bg-white p-6 rounded-xl border border-gray-200 text-center space-y-2">
            <p class="text-gray-600 font-medium">${selectedTagFilter ? 'No transactions with this tag.' : 'No transactions yet.'}</p>
            <p class="text-xs text-gray-400">${selectedTagFilter ? 'Try picking a different tag filter above.' : 'Tap "+ Add Tx" above to log a deposit or spending.'}</p>
          </div>
        `;
        return;
      }

      list.innerHTML = filteredTx.map(tx => {
        const amt = parseFloat(tx.amount || 0);
        const isPositive = amt >= 0;
        const status = tx.status || 'pending';
        const isPending = status === 'pending';
        const tags = Array.isArray(tx.tags) ? tx.tags : [];

        const displayTitle = tx.description || tx.payee || 'Transaction';
        const subTitle = (tx.description && tx.payee) ? tx.payee : '';

        const tagsHtml = tags.length > 0 ? `
          <div class="flex flex-wrap gap-1 mt-1">
            ${tags.map(t => `<span class="text-[10px] bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded font-medium">#${t}</span>`).join('')}
          </div>
        ` : '';

        const receiptUrls = tx.receipt_url ? tx.receipt_url.split(',').map(u => u.trim()).filter(Boolean) : [];
        const receiptBtn = receiptUrls.length > 0 ? `
          <div class="flex gap-1 flex-wrap mt-0.5">
            ${receiptUrls.map((url, idx) => `
              <a href="${url}" target="_blank" onclick="event.stopPropagation()" class="text-[11px] bg-gray-100 hover:bg-gray-200 text-gray-600 px-1.5 py-0.5 rounded flex items-center gap-1 font-medium border border-gray-200">
                📎 Receipt ${receiptUrls.length > 1 ? idx + 1 : ''}
              </a>
            `).join('')}
          </div>
        ` : '';

        return `
          <div onclick="openTxModal('${tx.id}')" class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center cursor-pointer hover:border-blue-300 transition-all">
            <div>
              <div class="flex items-center gap-2">
                <p class="font-semibold text-gray-900 text-sm">${displayTitle}</p>
              </div>
              ${receiptBtn}
              ${subTitle ? `<p class="text-xs text-gray-500 font-medium mt-0.5">${subTitle}</p>` : ''}
              <p class="text-xs text-gray-400 mt-0.5">${tx.date}</p>
              ${tagsHtml}
            </div>
            <div class="flex items-center gap-2">
              <span class="font-bold text-sm ${isPositive ? 'text-emerald-600' : 'text-gray-900'}">
                ${isPositive ? '+' : ''}$${amt.toFixed(2)}
              </span>
              <button 
                onclick="event.stopPropagation(); toggleTxStatus('${tx.id}', '${status}')" 
                title="Status: ${status}. Click to toggle"
                class="px-2 py-0.5 text-xs font-bold rounded-full transition-colors ${isPending
            ? 'bg-amber-100 text-amber-700 hover:bg-amber-200'
            : 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200'
          }">
                ${isPending ? 'P' : 'R'}
              </button>
              <button onclick="event.stopPropagation(); deleteTx('${tx.id}', '${displayTitle}')" class="text-red-400 hover:text-red-600 text-base font-bold px-1">&times;</button>
            </div>
          </div>
        `;
      }).join('');
    }

    async function toggleTxStatus(id, currentStatus) {
      const newStatus = currentStatus === 'pending' ? 'reconciled' : 'pending';
      const { error } = await sb.from('transactions').update({ status: newStatus }).eq('id', id);
      if (error) {
        alert("Error updating status: " + error.message);
        return;
      }
      fetchTransactions(activeAccountId);
      fetchAccounts();
    }

    function updatePayeeLabel() {
      const type = document.getElementById('txType').value;
      const label = document.getElementById('txPayeeLabel');
      if (label) {
        label.textContent = type === 'income' ? 'Payer' : 'Payee';
      }
    }

    function populateAccountDropdown(selectedId = null) {
      const select = document.getElementById('txAccount');
      if (!accounts || accounts.length === 0) {
        select.innerHTML = `<option value="">No accounts available</option>`;
        return;
      }

      select.innerHTML = accounts.map(acc => {
        const isSelected = (selectedId && acc.id === selectedId) || (!selectedId && activeAccountId && acc.id === activeAccountId);
        return `<option value="${acc.id}" ${isSelected ? 'selected' : ''}>${acc.name} (${acc.type})</option>`;
      }).join('');
    }

    // --- Image Cropper Integration Logic ---
    function handleImageInput(input) {
      const file = input.files && input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const imageToCrop = document.getElementById('imageToCrop');
        imageToCrop.src = e.target.result;
        document.getElementById('cropModal').classList.remove('hidden');

        if (cropper) {
          cropper.destroy();
        }

        cropper = new Cropper(imageToCrop, {
          aspectRatio: NaN,
          viewMode: 1,
        });
      };
      reader.readAsDataURL(file);
      input.value = '';
    }

    function cancelCrop() {
      document.getElementById('cropModal').classList.add('hidden');
      if (cropper) {
        cropper.destroy();
        cropper = null;
      }
    }

    function confirmCrop() {
      if (!cropper) return;

      const canvas = cropper.getCroppedCanvas({
        maxWidth: 1200,
        maxHeight: 1200,
        imageSmoothingQuality: 'high',
      });

      canvas.toBlob((blob) => {
        const croppedFile = new File([blob], `receipt_${Date.now()}.jpg`, { type: 'image/jpeg' });
        activeReceiptFiles.push(croppedFile);

        cancelCrop();
        renderModalReceiptList();
      }, 'image/jpeg', 0.85);
    }

    function renderModalReceiptList() {
      const preview = document.getElementById('receiptPreview');
      const container = document.getElementById('receiptLinksList');
      const statusText = document.getElementById('fileSelectionStatus');

      const totalCount = activeReceiptUrls.length + activeReceiptFiles.length;

      if (totalCount === 0) {
        preview.classList.add('hidden');
        container.innerHTML = '';
        statusText.classList.add('hidden');
        return;
      }

      preview.classList.remove('hidden');
      statusText.textContent = `✓ ${totalCount} attachment${totalCount > 1 ? 's' : ''} ready`;
      statusText.classList.remove('hidden');

      let html = '';

      activeReceiptUrls.forEach((url, idx) => {
        html += `
          <div class="flex items-center justify-between bg-gray-50 border border-gray-200 p-2 rounded-lg text-xs">
            <a href="${url}" target="_blank" class="text-blue-600 font-semibold underline truncate max-w-[200px]">
              Receipt URL ${activeReceiptUrls.length > 1 ? idx + 1 : ''}
            </a>
            <button type="button" onclick="removeExistingReceipt(${idx})" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-[11px] font-semibold px-2 py-0.5 rounded transition-colors">
              Remove
            </button>
          </div>
        `;
      });

      activeReceiptFiles.forEach((file, idx) => {
        html += `
          <div class="flex items-center justify-between bg-blue-50 border border-blue-200 p-2 rounded-lg text-xs">
            <span class="text-blue-700 font-semibold truncate max-w-[200px]">
              📷 Cropped: ${file.name}
            </span>
            <button type="button" onclick="removeNewReceipt(${idx})" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-[11px] font-semibold px-2 py-0.5 rounded transition-colors">
              Remove
            </button>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function removeExistingReceipt(index) {
      activeReceiptUrls.splice(index, 1);
      renderModalReceiptList();
    }

    function removeNewReceipt(index) {
      activeReceiptFiles.splice(index, 1);
      renderModalReceiptList();
    }

    function openTxModal(txId = null) {
      if (accounts.length === 0) {
        alert("Please create an account first before adding transactions.");
        return;
      }

      const form = document.getElementById('tx-form');
      form.reset();
      const deleteBtn = document.getElementById('txDeleteBtn');

      activeReceiptFiles = [];
      activeReceiptUrls = [];

      if (txId) {
        const tx = transactions.find(t => t.id === txId);
        if (!tx) return;

        const amt = parseFloat(tx.amount || 0);
        document.getElementById('tx-modal-title').textContent = "Edit Transaction";
        document.getElementById('txSubmitBtn').textContent = "Update Transaction";
        document.getElementById('editingTxId').value = tx.id;
        populateAccountDropdown(tx.account_id);
        document.getElementById('txDesc').value = tx.description || '';
        document.getElementById('txPayee').value = tx.payee || '';
        document.getElementById('txType').value = amt >= 0 ? 'income' : 'expense';
        document.getElementById('txAmount').value = Math.abs(amt);
        document.getElementById('txPaymentMethod').value = tx.payment_method || 'debit';
        document.getElementById('txDate').value = tx.date || new Date().toISOString().split('T')[0];
        document.getElementById('txStatus').value = tx.status || 'pending';
        document.getElementById('txTags').value = Array.isArray(tx.tags) ? tx.tags.join(', ') : '';

        if (tx.receipt_url) {
          activeReceiptUrls = tx.receipt_url.split(',').map(u => u.trim()).filter(Boolean);
        }

        deleteBtn.classList.remove('hidden');
      } else {
        document.getElementById('tx-modal-title').textContent = "Add Transaction";
        document.getElementById('txSubmitBtn').textContent = "Save Transaction";
        document.getElementById('editingTxId').value = "";
        populateAccountDropdown(activeAccountId);
        document.getElementById('txPayee').value = "";
        document.getElementById('txPaymentMethod').value = "debit";
        document.getElementById('txDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('txStatus').value = 'pending';
        document.getElementById('txTags').value = '';

        deleteBtn.classList.add('hidden');
      }

      renderModalReceiptList();
      updatePayeeLabel();
      toggleTxModal(true);
    }

    async function handleTxSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('txSubmitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = "Saving...";

      const editId = document.getElementById('editingTxId').value;
      const targetAccountId = document.getElementById('txAccount').value;
      const description = document.getElementById('txDesc').value;
      const payee = document.getElementById('txPayee').value;
      const payment_method = document.getElementById('txPaymentMethod').value;
      const txType = document.getElementById('txType').value;
      let amount = parseFloat(document.getElementById('txAmount').value) || 0;
      const date = document.getElementById('txDate').value;
      const status = document.getElementById('txStatus').value;

      if (!targetAccountId) {
        alert("Please select an account.");
        submitBtn.disabled = false;
        submitBtn.textContent = editId ? "Update Transaction" : "Save Transaction";
        return;
      }

      const rawTags = document.getElementById('txTags').value;
      const tags = rawTags
        .split(',')
        .map(t => t.trim().toLowerCase())
        .filter(t => t.length > 0);

      if (txType === 'expense' && amount > 0) {
        amount = -amount;
      }

      let finalReceiptUrls = [...activeReceiptUrls];

      if (activeReceiptFiles.length > 0) {
        for (const file of activeReceiptFiles) {
          const fileExt = file.name.split('.').pop();
          const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;

          const { error: uploadError } = await sb.storage
            .from('receipts')
            .upload(fileName, file);

          if (uploadError) {
            alert(`Error uploading file: ${uploadError.message}`);
            submitBtn.disabled = false;
            submitBtn.textContent = editId ? "Update Transaction" : "Save Transaction";
            return;
          }

          const { data: publicUrlData } = sb.storage
            .from('receipts')
            .getPublicUrl(fileName);

          finalReceiptUrls.push(publicUrlData.publicUrl);
        }
      }

      const payload = {
        account_id: targetAccountId,
        description: description || payee || 'Transaction',
        payee,
        payment_method,
        amount,
        date,
        status,
        tags,
        receipt_url: finalReceiptUrls.join(', ')
      };

      let error;
      if (editId) {
        ({ error } = await sb.from('transactions').update(payload).eq('id', editId));
      } else {
        ({ error } = await sb.from('transactions').insert([payload]));
      }

      submitBtn.disabled = false;

      if (error) {
        alert("Error saving transaction: " + error.message);
        submitBtn.textContent = editId ? "Update Transaction" : "Save Transaction";
        return;
      }

      toggleTxModal(false);
      if (activeAccountId) {
        fetchTransactions(activeAccountId);
      }
      fetchAccounts();
    }

    async function handleDeleteTxFromModal() {
      const id = document.getElementById('editingTxId').value;
      const desc = document.getElementById('txDesc').value || 'this transaction';
      if (!id) return;

      if (!confirm(`Are you sure you want to delete transaction "${desc}"?`)) return;

      const { error } = await sb.from('transactions').delete().eq('id', id);
      if (error) {
        alert("Error deleting transaction: " + error.message);
        return;
      }

      toggleTxModal(false);
      if (activeAccountId) {
        fetchTransactions(activeAccountId);
      }
      fetchAccounts();
    }

    async function deleteTx(id, description = 'this transaction') {
      if (!confirm(`Delete "${description}"?`)) return;
      const { error } = await sb.from('transactions').delete().eq('id', id);
      if (error) {
        alert("Error deleting transaction: " + error.message);
        return;
      }
      if (activeAccountId) {
        fetchTransactions(activeAccountId);
      }
      fetchAccounts();
    }

    function openAccountModal(accountId = null) {
      const form = document.getElementById('account-form');
      form.reset();
      const deleteBtn = document.getElementById('deleteBtn');

      if (accountId) {
        const acc = accounts.find(a => a.id === accountId);
        if (!acc) return;
        document.getElementById('modal-title').textContent = "Edit Account";
        document.getElementById('submitBtn').textContent = "Update Account";
        document.getElementById('editingAccId').value = acc.id;
        document.getElementById('accName').value = acc.name || '';
        document.getElementById('accType').value = acc.type || 'checking';
        document.getElementById('accBalance').value = acc.initial_balance || '0.00';
        document.getElementById('accInstitution').value = acc.institution || '';
        document.getElementById('accNumber').value = acc.account_number || '';
        deleteBtn.classList.remove('hidden');
      } else {
        document.getElementById('modal-title').textContent = "Add New Account";
        document.getElementById('submitBtn').textContent = "Create Account";
        document.getElementById('editingAccId').value = "";
        deleteBtn.classList.add('hidden');
      }

      toggleAccountModal(true);
    }

    async function handleAccountSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;

      const editId = document.getElementById('editingAccId').value;
      const payload = {
        name: document.getElementById('accName').value,
        type: document.getElementById('accType').value,
        initial_balance: parseFloat(document.getElementById('accBalance').value) || 0,
        institution: document.getElementById('accInstitution').value,
        account_number: document.getElementById('accNumber').value
      };

      let error;
      if (editId) {
        ({ error } = await sb.from('accounts').update(payload).eq('id', editId));
      } else {
        ({ error } = await sb.from('accounts').insert([payload]));
      }

      submitBtn.disabled = false;

      if (error) {
        alert("Error saving account: " + error.message);
        return;
      }

      toggleAccountModal(false);
      fetchAccounts();
    }

    async function handleDeleteFromModal() {
      const id = document.getElementById('editingAccId').value;
      const name = document.getElementById('accName').value || 'this account';
      if (!id) return;

      if (!confirm(`Are you sure you want to delete "${name}"? This will also remove associated transactions.`)) return;

      const { error } = await sb.from('accounts').delete().eq('id', id);
      if (error) {
        alert("Error deleting account: " + error.message);
        return;
      }

      toggleAccountModal(false);
      fetchAccounts();
    }

    function toggleAccountModal(show) {
      const modal = document.getElementById('account-modal');
      if (show) modal.classList.remove('hidden');
      else modal.classList.add('hidden');
    }

    function toggleTxModal(show) {
      const modal = document.getElementById('tx-modal');
      if (show) modal.classList.remove('hidden');
      else modal.classList.add('hidden');
    }

    window.onload = init;
  </script>
</body>

</html>
